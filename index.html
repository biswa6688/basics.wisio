<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wisio.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wisio — Wisdom, Byte by Byte. Learn computer fundamentals through rich, illustrated interactive lessons." />
    <meta name="theme-color" content="#16a34a" />
    <title>Wisio — Wisdom, Byte by Byte</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wisio-theme-preference')
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
